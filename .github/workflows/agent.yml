# On-demand open-ended analysis agent for Flash-MX.
name: agent

on:
  workflow_dispatch:
    inputs:
      objective:
        description: 'Objective for the agent (write a paragraph if needed)'
        required: true
        type: string
      model:
        description: 'Claude model ID (blank: claude-opus-5-5)'
        required: false
        default: 'claude-opus-5-5'

jobs:
  analyze:
    name: "Analyze"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      WORK: .analysis
      MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
      OBJECTIVE: ${{ inputs.objective }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compute image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/flashx-container:latest" >> "$GITHUB_ENV"

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Download latest test results (best effort)
        continue-on-error: true
        run: |
          id=$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // ""')
          if [ -n "$id" ]; then
            mkdir -p "$WORK/results"
            gh run download "$id" --name TestResults --dir "$WORK/results" 2>/dev/null || true
          fi

      - name: Run agent inside container
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          docker run --rm \
            --user flashx \
            -e HOME=/home/flashx \
            -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            -e OBJECTIVE="$OBJECTIVE" \
            -e MODEL="$MODEL" \
            -e SHA="$GITHUB_SHA" \
            -e BRANCH="$GITHUB_REF_NAME" \
            -v "${{ github.workspace }}:/home/mount/FlashX" \
            -w /home/mount/FlashX \
            "$IMAGE" \
            bash -c 'export PATH="/home/flashx/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" && /usr/bin/python3 .github/agent/tools/agent.py run --auth api_key'

      - name: Publish summary to workflow page
        if: always()
        run: |
          if [ -f .analysis/report.md ]; then
            cat .analysis/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f .analysis/review.md ]; then
            cat .analysis/review.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-analysis
          path: |
            .analysis/*.md
            .analysis/*.json
          if-no-files-found: ignore