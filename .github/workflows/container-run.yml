# Run the Flash-X test suite (flashxtest) inside the container image and compare
# results against downloaded benchmarks, using the sites/container Makefile.h
# (AMReX + HYPRE).
#
# A discover-suites job reads *.suite files from sites/container/testsuites/ and
# builds the matrix dynamically — adding a new .suite file is enough to get a new
# parallel job without editing this workflow.
name: container-run

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - staged
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  discover-suites:
    name: "Discover test suites"
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4

      - name: List suite files
        id: list
        run: |
          suites=$(ls sites/container/testsuites/*.suite \
            | xargs -n1 basename | sed 's/\.suite$//' \
            | jq -R . | jq -sc .)
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Found suites: $suites"

  # Every run pulls ghcr.io/<owner>/flashx-container:latest. If that image is
  # being rebuilt (container-update-image.yml, e.g. triggered by the same push
  # that changed the Dockerfile, or a manual dispatch), wait for the build to
  # finish so the tests use the new image rather than the stale one. If the
  # build for this very commit failed, fail here instead of testing the old image.
  wait-for-image:
    name: "Wait for image build"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE_WORKFLOW: container-update-image.yml
    steps:
      - name: Wait for in-progress image builds
        run: |
          while :; do
            active=$(gh run list --workflow "$IMAGE_WORKFLOW" --limit 50 \
                       --json databaseId,status \
                       --jq '[.[] | select(.status != "completed") | .databaseId] | join(" ")')
            [ -z "$active" ] && break
            echo "Image build(s) in progress: $active -- checking again in 60s"
            sleep 60
          done
          echo "No image build in progress."

      - name: Check image build for this commit
        run: |
          conclusion=$(gh run list --workflow "$IMAGE_WORKFLOW" --commit "$GITHUB_SHA" \
                         --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
            echo "Image build for $GITHUB_SHA finished with '$conclusion'; not testing against a stale image."
            exit 1
          fi

  test-suite:
    needs: [discover-suites, wait-for-image]
    name: "test-suite / ${{ matrix.suite }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover-suites.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR/Docker image names must be lowercase; the owner may contain uppercase.
      - name: Compute image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/flashx-container:latest" >> "$GITHUB_ENV"

      - name: Pull image
        run: docker pull "$IMAGE"

      # Download every benchmark archive listed in BENCHMARK_ARCHIVE_URLS into
      # LocalArchive/ (accessible to the container via the workspace mount at
      # /home/mount/FlashX/LocalArchive).  Tests resolve -cbase/-rbase entries
      # from LocalArchive via the -a flag passed to flashxtest init.
      - name: Download benchmark archives
        env:
          ARCHIVE_URLS: ${{ vars.BENCHMARK_ARCHIVE_URLS }}
        run: |
          mkdir -p "${{ github.workspace }}/LocalArchive/container"
          URLS=$(printf '%s' "$ARCHIVE_URLS" | tr -s '[:space:]' ' ')
          if [ -n "$URLS" ]; then
            for url in $URLS; do
              tmp=$(mktemp)
              echo "Downloading: $url"
              curl -fsSL -o "$tmp" "$url"
              if ! file "$tmp" | grep -qE "gzip compressed|tar archive"; then
                echo "ERROR: $url did not return a tar archive (got: $(file "$tmp"))"
                rm -f "$tmp"
                exit 1
              fi
              tar xf "$tmp" -C "${{ github.workspace }}/LocalArchive/container"
              rm -f "$tmp"
            done
          fi

      # Initialize the testing environment and run the suite inside the container.
      # The repo is mounted at /home/mount/FlashX; archive/outdir live on the
      # mount so artifacts survive on the host. --user flashx (uid 1001) matches
      # the runner uid, giving write access to the mounted workspace.
      # ViewArchive (-vv) is still written by run-suite --archive. Passing the
      # suite file to run-suite (re)creates test.info first. No per-suite webview
      # is built here: publish-website packages one from the merged results.
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          docker run --rm \
            --user flashx \
            -e HOME=/home/flashx \
            -e OMPI_MCA_btl_vader_single_copy_mechanism=none \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_MCA_rmaps_base_oversubscribe=1 \
            -e SUITE="$SUITE" \
            -v "${{ github.workspace }}:/home/mount/FlashX" \
            -w /home/mount/FlashX/sites/container/testsuites \
            "$IMAGE" \
            bash -lc '
              flashxtest init -z /home/mount/FlashX -s container \
                -a /home/mount/FlashX/LocalArchive \
                -o /home/mount/FlashX/TestResults \
                -vv /home/mount/FlashX/ViewArchive \
                -mpi=mpirun -make="make -j" &&
              flashxtest run-suite --archive --skip-mainarchive "${SUITE}.suite"
            '

      - name: Upload test results
        id: upload-testresults
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.suite }}
          path: |
            TestResults/**
          if-no-files-found: ignore

      # Render the artifact download link at the bottom of the job summary.
      # artifact-url is empty when the upload was skipped (no files found).
      - name: Render download links
        if: always()
        env:
          TESTRESULTS_URL: ${{ steps.upload-testresults.outputs.artifact-url }}
        run: |
          links=""
          [ -n "$TESTRESULTS_URL" ] && links="$links 📊 [TestResults]($TESTRESULTS_URL) ·"
          if [ -n "$links" ]; then
            {
              echo "## 📦 Downloads"
              echo ""
              echo "${links% ·}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Publish test results to the "Dev" page of the public website
  # (https://github.com/Flash-MX/flash-mx.github.io).
  #
  # Division of labour: flashxtest only packages a webview of a results directory.
  # Everything else is decided here: which branches publish, that each branch label
  # keeps its latest run plus the last fully passing run (when latest fails), where
  # things are placed, and that the dev-results branch has no history.
  #
  # Website repo layout: main holds site content (never touched here); the
  # dev-results branch holds only dev/<label>/{latest,passing}/ and dev/index.html
  # and is force-pushed as a single orphan commit. The website's deploy workflow
  # (started explicitly by the last step) combines both branches.
  #
  # Requires a repository secret WEBSITE_DEPLOY_TOKEN with write access
  # (contents: write) to Flash-MX/flash-mx.github.io.
  publish-website:
    name: "Publish results to website"
    needs: [discover-suites, test-suite]
    if: >-
      always()
      && github.event_name != 'pull_request'
      && (github.ref_name == 'main' || github.ref_name == 'staged')
      && needs.discover-suites.result == 'success'
      && needs.test-suite.result != 'skipped'
      && needs.test-suite.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read   # list this run's artifacts for links on the website
    # One publisher at a time so pushes to the website repo never race.
    concurrency:
      group: publish-website
      cancel-in-progress: false
    env:
      WEBSITE_REPO: Flash-MX/flash-mx.github.io
      LABEL: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/flashx-container:latest" >> "$GITHUB_ENV"

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: TestResults-*
          path: artifacts

      # Each matrix job produced <site>/<YYYY-MM-DD>/<build>/... plus invocation
      # level "errors" and "flash_test.log". Combine them into a single
      # invocation: builds are disjoint across suites, the two invocation-level
      # files are concatenated so the overall status reflects every suite.
      - name: Merge suite results
        run: |
          shopt -s nullglob
          found=0
          for inv in $(find artifacts -type d -regextype posix-extended \
                         -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort); do
            site=$(basename "$(dirname "$inv")")
            dst="merged/$site/$(basename "$inv")"
            mkdir -p "$dst"
            for f in errors flash_test.log; do
              [ -f "$inv/$f" ] && cat "$inv/$f" >> "$dst/$f"
            done
            cp -a --no-clobber "$inv/." "$dst/"
            found=1
          done
          if [ "$found" = 0 ]; then
            echo "No test results found; nothing to publish."
            exit 1
          fi
          find merged -maxdepth 3 -type d

      # flashxtest's only job: package a self-contained webview (with summary.json)
      # of the merged results. --results needs no config; --force-rewrite is not
      # needed since pkg does not exist yet.
      - name: Package webview
        run: |
          docker run --rm \
            --user flashx \
            -e HOME=/home/flashx \
            -v "${{ github.workspace }}:/home/mount/work" \
            -w /home/mount/work \
            "$IMAGE" \
            flashxtest webview --outdir pkg --results merged

      # The website only carries the lightweight webview; the full outputs
      # (flash_output, HDF5 checkpoint/plot files, build logs, ...) stay in the
      # TestResults-* workflow artifacts. Record the run URL and a permanent link
      # to each artifact in pkg/run.json so dev_index.py can link to them. The
      # file travels with the run when it is kept as "passing", so the links
      # always point at the run that produced those results. Artifacts expire
      # after the repository's retention period; expires_at is recorded so the
      # page can say when a link is no longer valid.
      - name: Record run and artifact links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > artifacts.json
          jq --arg server "$GITHUB_SERVER_URL" --arg repo "$GITHUB_REPOSITORY" \
             --arg run_id "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" '
            ($server + "/" + $repo) as $base
            | {
                run_url: "\($base)/actions/runs/\($run_id)",
                commit: $sha,
                commit_url: "\($base)/commit/\($sha)",
                ref: $ref,
                artifacts: ([.artifacts[]
                  | select(.name | startswith("TestResults-"))
                  | select(.expired | not)
                  | {name, size_in_bytes, expires_at,
                     url: "\($base)/actions/runs/\($run_id)/artifacts/\(.id)"}]
                  | sort_by(.name))
              }' artifacts.json > pkg/run.json
          cat pkg/run.json

      - name: Fetch current dev-results branch
        env:
          TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "WEBSITE_DEPLOY_TOKEN is not set"; exit 1; }
          git init -q devsite
          cd devsite
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${WEBSITE_REPO}.git"
          if git ls-remote --exit-code --heads origin dev-results >/dev/null; then
            git fetch -q --depth 1 origin dev-results
            git checkout -q -B dev-results FETCH_HEAD
          fi

      # Keep the latest run, plus the last fully passing run while latest is not
      # passing. A run passes when every site in its summary.json is green.
      - name: Place results
        run: |
          passing() { jq -e 'length > 0 and all(.[]; .colour == "green")' "$1" >/dev/null; }
          dest="devsite/dev/${LABEL}"
          mkdir -p "$dest"
          if passing pkg/summary.json; then
            rm -rf "$dest/passing"                       # latest is the last success
          elif [ -f "$dest/latest/summary.json" ] && passing "$dest/latest/summary.json"; then
            rm -rf "$dest/passing"
            mv "$dest/latest" "$dest/passing"            # previous latest passed: keep it
          fi                                             # else keep the existing passing run
          rm -rf "$dest/latest"
          cp -a pkg "$dest/latest"
          python3 .github/scripts/dev_index.py devsite/dev

      - name: Commit and push (history purged)
        working-directory: devsite
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet && git rev-parse -q --verify HEAD >/dev/null; then
            echo "dev results already up to date."
            exit 0
          fi
          git checkout -q --orphan publish
          git add -A
          git commit -q -m "Update ${LABEL} test results (${GITHUB_SHA::8})" \
                     -m "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push --force origin publish:dev-results

      # A push to dev-results cannot start the website's deploy workflow (that
      # workflow file lives on main, not on dev-results), so start it explicitly
      # on main. The token needs Actions: Read and write on the website repo.
      - name: Trigger website deploy
        env:
          TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${WEBSITE_REPO}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
